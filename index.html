<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SD 提示詞生成器 (分區版)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="h-screen font-sans selection:bg-pink-500 selection:text-white flex flex-col overflow-hidden">

    <!-- 頂部導航 -->
    <header class="bg-zinc-900 border-b border-zinc-800 p-4 z-50 flex-none shadow-md">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1
                class="text-xl md:text-2xl font-bold bg-gradient-to-r from-blue-400 to-pink-500 bg-clip-text text-transparent flex items-center gap-2">
                <i data-lucide="sparkles" class="text-pink-500"></i>
                SD 提示詞生成器 <span
                    class="text-sm font-normal text-zinc-500 ml-2 border border-zinc-700 rounded px-2 py-0.5">v3.9.5
                    分區優化</span>
            </h1>
            <div class="text-xs text-zinc-500 font-mono hidden md:block">Optimized for Workflow</div>
        </div>
    </header>

    <!-- 可滾動的主內容區域 -->
    <div class="flex-1 overflow-y-auto scrollbar-hide w-full">
        <main class="max-w-6xl mx-auto p-4 space-y-4 pb-20">

            <!-- 1. 正面提示詞 -->
            <div
                class="bg-zinc-900 rounded-xl border border-zinc-800 p-4 shadow-lg flex flex-col min-h-[8rem] relative group hover:border-blue-500/50 transition-colors">
                <div class="flex justify-between items-center mb-2">
                    <label class="text-sm font-semibold text-blue-400 flex items-center gap-2">
                        <i data-lucide="settings" width="16" height="16"></i> 正面提示詞
                    </label>
                    <div class="flex gap-2 items-center">
                        <!-- Magic Button -->
                        <button onclick="addMagicPrompt()"
                            class="p-2 text-zinc-400 hover:text-purple-400 hover:bg-zinc-800 rounded-lg transition-all group/magic"
                            title="一鍵加入高品質起手式 (masterpiece, best quality, etc.)">
                            <div class="flex items-center gap-1">
                                <i data-lucide="wand-2" width="18" height="18"></i>
                                <span
                                    class="text-xs font-medium hidden md:inline group-hover/magic:text-purple-300">起手式</span>
                            </div>
                        </button>

                        <div class="w-px h-4 bg-zinc-800 mx-1"></div> <!-- 分隔線 -->

                        <button onclick="clearPrompt('positive')"
                            class="p-2 text-zinc-400 hover:text-red-400 hover:bg-zinc-800 rounded-lg transition-all"
                            title="清空">
                            <i data-lucide="trash-2" width="18" height="18"></i>
                        </button>
                        <button onclick="copyToClipboard('positive')"
                            class="p-2 text-zinc-400 hover:text-green-400 hover:bg-zinc-800 rounded-lg transition-all"
                            title="複製">
                            <i data-lucide="copy" width="18" height="18"></i>
                        </button>
                    </div>
                </div>
                <!-- textarea -->
                <textarea id="positive-input"
                    class="flex-1 w-full bg-zinc-950 border border-zinc-800 rounded-lg p-3 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500 text-zinc-300 font-mono leading-relaxed placeholder:text-zinc-700 overflow-hidden resize-none min-h-[4rem]"
                    placeholder="點擊下方標籤選擇基礎詞彙，或點擊魔術棒加入起手式..." oninput="autoResize(this)"></textarea>
                <div class="flex justify-end mt-2">
                    <div class="text-xs text-zinc-600 pointer-events-none">
                        <span id="positive-count">0</span> chars
                    </div>
                </div>
            </div>

            <!-- 2. 已選標籤顯示區 (點擊可刪除，顯示中文) -->
            <div id="selected-tags-wrapper" class="hidden">
                <div class="flex justify-between items-end mb-1 ml-1">
                    <div class="text-xs text-zinc-500 font-medium">已選標籤 (點擊移除，<span class="text-blue-400">按住 Ctrl
                            拖曳排序</span>):</div>
                </div>
                <div id="selected-tags-container" class="flex flex-wrap gap-2">
                    <!-- JS 動態生成 -->
                </div>
            </div>

            <!-- 3. 標籤選擇區 (含子頁籤) -->
            <div class="bg-zinc-900 rounded-xl border border-zinc-800 shadow-lg overflow-hidden flex flex-col">
                <!-- 大分類 Tabs -->
                <div id="tabs-container"
                    class="flex overflow-x-auto border-b border-zinc-800 scrollbar-hide bg-zinc-900 z-10">
                    <!-- Tabs will be injected here by JS -->
                </div>

                <!-- 子分類 Tabs -->
                <div class="border-b border-zinc-800/50 bg-zinc-900/50 px-4 py-3 overflow-x-auto scrollbar-hide">
                    <div id="sub-tabs-container" class="flex gap-2 min-w-max">
                        <!-- Sub-tabs will be injected here by JS -->
                    </div>
                </div>

                <!-- 標籤列表 -->
                <div class="p-6 bg-zinc-900/30 flex-1 min-h-[300px]">
                    <div id="tags-grid" class="flex flex-wrap gap-2 content-start transition-opacity duration-200">
                        <!-- Tags will be injected here by JS -->
                    </div>

                    <div class="mt-8 pt-6 border-t border-zinc-800/50">
                        <div class="text-zinc-600 text-sm flex items-center gap-2">
                            <i data-lucide="info" width="14" height="14"></i>
                            <span>提示：上方提供子分類切換。若需調整權重，請將詞彙括號起來，例如 <code
                                    class="bg-zinc-800 px-1 rounded text-pink-400">(tag:1.3)</code></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 4. 負面提示詞 -->
            <div
                class="bg-zinc-900 rounded-xl border border-zinc-800 shadow-lg flex flex-col relative group hover:border-red-500/50 transition-colors overflow-hidden">
                <!-- Header -->
                <div class="flex justify-between items-center p-4 cursor-pointer hover:bg-zinc-800/50 transition-colors"
                    onclick="toggleNegative()">
                    <label class="text-sm font-semibold text-red-400 flex items-center gap-2 cursor-pointer">
                        <i data-lucide="x" width="16" height="16"></i> 負面提示詞
                        <span class="text-xs text-zinc-500 font-normal ml-2">(點擊展開/收起)</span>
                    </label>
                    <i id="negative-chevron" data-lucide="chevron-down"
                        class="text-zinc-500 transition-transform duration-300"></i>
                </div>

                <!-- 可折疊內容 -->
                <div id="negative-content" class="hidden px-4 pb-4">
                    <div class="relative">
                        <!-- 按鈕 -->
                        <div class="absolute top-0 right-0 z-10 flex gap-2 -mt-10 mr-8 pointer-events-auto"
                            onclick="event.stopPropagation()">
                            <button onclick="clearPrompt('negative')"
                                class="p-2 text-zinc-400 hover:text-red-400 hover:bg-zinc-800 rounded-lg transition-all"
                                title="清空">
                                <i data-lucide="trash-2" width="18" height="18"></i>
                            </button>
                            <button onclick="copyToClipboard('negative')"
                                class="p-2 text-zinc-400 hover:text-green-400 hover:bg-zinc-800 rounded-lg transition-all"
                                title="複製">
                                <i data-lucide="copy" width="18" height="18"></i>
                            </button>
                        </div>

                        <!-- 負面提示詞輸入框 -->
                        <textarea id="negative-input"
                            class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-3 text-sm focus:outline-none focus:ring-1 focus:ring-red-500 text-zinc-400 font-mono leading-relaxed overflow-hidden resize-none min-h-[6rem]"
                            placeholder="輸入不希望出現的內容..."
                            oninput="autoResize(this)">lowres, bad anatomy, bad hands, text, error, missing fingers, extra digit, fewer digits, cropped, worst quality, low quality, normal quality, jpeg artifacts, signature, watermark, username, blurry, artist name, mosaic, censorship, bar_censor, glitch, deformed, mutated, ugly, disfigured</textarea>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- 通知 Toast -->
    <div id="notification"
        class="fixed bottom-8 left-1/2 transform -translate-x-1/2 bg-blue-600 text-white px-6 py-2 rounded-full shadow-lg text-sm font-medium z-50 transition-opacity duration-300 opacity-0 pointer-events-none">
    </div>

    <script src="data/character.js"></script>
    <script src="data/hair.js"></script>
    <script src="data/body.js"></script>
    <script src="data/r18.js"></script>
    <script src="data/action.js"></script>
    <script src="data/expression.js"></script>
    <script src="data/clothing.js"></script>
    <script src="data/accessories.js"></script>
    <script src="data/environment.js"></script>
    <script src="data/camera.js"></script>
    <script src="data/quality.js"></script>
    <script src="tabsData.js"></script>
    <script src="script.js"></script>
</body>

</html>
